<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b3d"/>
      <stop offset="0.42" stop-color="#25325e"/>
      <stop offset="0.66" stop-color="#7b5a78"/>
      <stop offset="0.82" stop-color="#d1743e"/>
      <stop offset="1" stop-color="#f3a44e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.45" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#a9750f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f4d"/>
      <stop offset="1" stop-color="#20263f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#sky)"/>
  <circle cx="55" cy="470" r="130" fill="url(#sun)"/>

  <!-- feux d'artifice -->
  <g stroke-linecap="round" opacity="0.9">
    <g stroke="#f7c948" stroke-width="1.6">
      <line x1="72" y1="96" x2="72" y2="62"/><line x1="72" y1="96" x2="102" y2="76"/><line x1="72" y1="96" x2="42" y2="76"/><line x1="72" y1="96" x2="94" y2="120"/><line x1="72" y1="96" x2="50" y2="120"/><line x1="72" y1="96" x2="108" y2="98"/><line x1="72" y1="96" x2="36" y2="98"/>
    </g>
    <g stroke="#4fbf6b" stroke-width="1.6">
      <line x1="330" y1="120" x2="330" y2="88"/><line x1="330" y1="120" x2="358" y2="100"/><line x1="330" y1="120" x2="302" y2="100"/><line x1="330" y1="120" x2="350" y2="142"/><line x1="330" y1="120" x2="310" y2="142"/><line x1="330" y1="120" x2="364" y2="122"/><line x1="330" y1="120" x2="296" y2="122"/>
    </g>
    <g stroke="#ffffff" stroke-width="1.2" opacity="0.85">
      <line x1="205" y1="72" x2="205" y2="48"/><line x1="205" y1="72" x2="226" y2="58"/><line x1="205" y1="72" x2="184" y2="58"/><line x1="205" y1="72" x2="220" y2="88"/><line x1="205" y1="72" x2="190" y2="88"/>
    </g>
  </g>
  <!-- confettis -->
  <g opacity="0.85">
    <rect x="120" y="150" width="6" height="10" fill="#ff7900" transform="rotate(25 123 155)"/>
    <rect x="300" y="180" width="6" height="10" fill="#009e60" transform="rotate(-20 303 185)"/>
    <rect x="90" y="230" width="5" height="9" fill="#ffffff" transform="rotate(40 92 234)"/>
    <rect x="330" y="250" width="5" height="9" fill="#ff7900" transform="rotate(-35 332 254)"/>
    <rect x="60" y="300" width="5" height="9" fill="#f7c948" transform="rotate(15 62 304)"/>
    <rect x="350" y="330" width="5" height="9" fill="#009e60" transform="rotate(-25 352 334)"/>
  </g>

  <!-- eau -->
  <rect x="0" y="470" width="400" height="60" fill="url(#water)"/>
  <!-- skyline d'Abidjan (silhouette) -->
  <g fill="#151d38">
    <rect x="196" y="392" width="14" height="78"/><rect x="212" y="410" width="12" height="60"/><rect x="226" y="400" width="10" height="70"/><rect x="238" y="420" width="12" height="50"/><rect x="188" y="418" width="8" height="52"/><rect x="252" y="416" width="10" height="54"/><rect x="264" y="426" width="10" height="44"/>
    <rect x="298" y="404" width="10" height="66"/><rect x="310" y="418" width="10" height="52"/><rect x="322" y="410" width="9" height="60"/><rect x="333" y="424" width="10" height="46"/><rect x="345" y="416" width="9" height="54"/><rect x="356" y="428" width="10" height="42"/>
  </g>
  <!-- reflets dans l'eau -->
  <g stroke="#f7c948" stroke-width="1" opacity="0.35">
    <line x1="205" y1="472" x2="205" y2="498"/><line x1="232" y1="472" x2="232" y2="492"/><line x1="305" y1="472" x2="305" y2="496"/><line x1="330" y1="472" x2="330" y2="490"/>
  </g>
  <!-- pont à haubans (HKB) -->
  <g stroke="#1a2340" stroke-width="2" fill="none">
    <path d="M150 466 L400 466"/>
    <path d="M300 466 L300 388"/>
    <g stroke="#26325a" stroke-width="1">
      <line x1="300" y1="392" x2="230" y2="466"/><line x1="300" y1="392" x2="255" y2="466"/><line x1="300" y1="392" x2="345" y2="466"/><line x1="300" y1="392" x2="372" y2="466"/>
    </g>
  </g>

  <!-- éléphant (silhouette, emblème national) -->
  <g fill="#12193a">
    <ellipse cx="98" cy="430" rx="52" ry="34"/>
    <circle cx="150" cy="418" r="26"/>
    <ellipse cx="140" cy="404" rx="16" ry="20"/>
    <path d="M168 420 q22 6 20 34 q-2 14 -12 16 q-8 1 -8 -8 q2 -18 -8 -30 z"/>
    <path d="M165 442 q8 8 4 18" stroke="#f4f0e4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M172 440 q9 7 6 17" stroke="#f4f0e4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="70" y="452" width="10" height="26" rx="3"/><rect x="92" y="454" width="10" height="24" rx="3"/><rect x="116" y="452" width="10" height="26" rx="3"/><rect x="134" y="450" width="10" height="28" rx="3"/>
  </g>

  <!-- foule + drapeaux -->
  <g>
    <rect x="0" y="520" width="400" height="80" fill="#0d1330"/>
    <g fill="#161d3d">
      <circle cx="30" cy="522" r="15"/><circle cx="66" cy="526" r="16"/><circle cx="104" cy="522" r="15"/><circle cx="142" cy="527" r="16"/><circle cx="182" cy="522" r="15"/><circle cx="222" cy="527" r="16"/><circle cx="262" cy="522" r="15"/><circle cx="302" cy="527" r="16"/><circle cx="342" cy="522" r="15"/><circle cx="378" cy="526" r="15"/>
    </g>
    <!-- mini-drapeaux ivoiriens levés -->
    <g>
      <g transform="translate(48,494)"><rect x="0" y="0" width="1.6" height="30" fill="#caa54a"/><rect x="1.6" y="0" width="7" height="5" fill="#ff7900"/><rect x="8.6" y="0" width="7" height="5" fill="#ffffff"/><rect x="15.6" y="0" width="7" height="5" fill="#009e60"/></g>
      <g transform="translate(128,488)"><rect x="0" y="0" width="1.6" height="34" fill="#caa54a"/><rect x="1.6" y="0" width="7" height="5" fill="#ff7900"/><rect x="8.6" y="0" width="7" height="5" fill="#ffffff"/><rect x="15.6" y="0" width="7" height="5" fill="#009e60"/></g>
      <g transform="translate(238,492)"><rect x="0" y="0" width="1.6" height="32" fill="#caa54a"/><rect x="1.6" y="0" width="7" height="5" fill="#ff7900"/><rect x="8.6" y="0" width="7" height="5" fill="#ffffff"/><rect x="15.6" y="0" width="7" height="5" fill="#009e60"/></g>
      <g transform="translate(318,486)"><rect x="0" y="0" width="1.6" height="36" fill="#caa54a"/><rect x="1.6" y="0" width="7" height="5" fill="#ff7900"/><rect x="8.6" y="0" width="7" height="5" fill="#ffffff"/><rect x="15.6" y="0" width="7" height="5" fill="#009e60"/></g>
    </g>
  </g>

  <!-- textes -->
  <text x="200" y="150" text-anchor="middle" fill="url(#gold)" font-size="110" font-weight="bold" style="paint-order:stroke" stroke="#7a5210" stroke-width="1">66<tspan font-size="46" dy="-44">e</tspan></text>
  <text x="200" y="200" text-anchor="middle" fill="url(#gold)" font-size="33" font-weight="bold" letter-spacing="3">ANNIVERSAIRE</text>
  <text x="200" y="228" text-anchor="middle" fill="#ffffff" font-size="12.5" letter-spacing="1.2">DE L'INDÉPENDANCE DE LA CÔTE D'IVOIRE</text>
  <g stroke="#f7c948" stroke-width="1" opacity="0.8"><line x1="120" y1="244" x2="280" y2="244"/></g>
  <text x="200" y="272" text-anchor="middle" fill="#f7c948" font-size="19" font-weight="bold" letter-spacing="1">7 AOÛT 1960 — 7 AOÛT 2026</text>
  <text x="200" y="312" text-anchor="middle" fill="#ffffff" font-size="25" font-style="italic" font-family="'Segoe Script','Brush Script MT','Comic Sans MS',cursive">Bonne fête de l'Indépendance !</text>

  <!-- grand drapeau agité (bas-droit) -->
  <g transform="translate(300,330)">
    <rect x="0" y="0" width="2.5" height="150" fill="#8a6a2e"/>
    <path d="M2.5,4 q22,-8 44,0 q22,8 44,0 l0,48 q-22,8 -44,0 q-22,-8 -44,0 z" fill="#ff7900"/>
    <path d="M2.5,4 q22,-8 44,0 q22,8 44,0 l0,48 q-22,8 -44,0 q-22,-8 -44,0 z" fill="none"/>
  </g>
  <g transform="translate(300,330)" opacity="1">
    <clipPath id="wave"><path d="M2.5,4 q22,-8 44,0 q22,8 44,0 l0,48 q-22,8 -44,0 q-22,-8 -44,0 z"/></clipPath>
    <g clip-path="url(#wave)"><rect x="2.5" y="0" width="29.5" height="60" fill="#ff7900"/><rect x="32" y="0" width="29.5" height="60" fill="#ffffff"/><rect x="61.5" y="0" width="29.5" height="60" fill="#009e60"/></g>
  </g>

  <text x="200" y="588" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="11" font-family="system-ui, sans-serif">EduWeb Booking · Côte d'Ivoire</text>
</svg>
